# Owner(s): ["oncall: releng"]
name: Sign Windows wheel

on:
  workflow_call:
    inputs:
      enabled:
        type: boolean
        default: false
        description: Explicit per-build opt-in; disabled is unsigned, not verified signing
      build_name:
        type: string
        required: true
      backend:
        type: string
        required: true

permissions:
  contents: read

jobs:
  authorize:
    if: inputs.enabled
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .ci/wheel/windows
      - name: Require an official protected release context
        run: python3 .ci/wheel/windows/sign_wheel.py check-release

  sign:
    needs: authorize
    # The environment, runner and OIDC trust policy must also exclude PRs.
    if: >-
      ${{ inputs.enabled && github.repository == 'pytorch/pytorch' &&
          github.event_name == 'push' && github.ref_protected &&
          (github.ref == 'refs/heads/nightly' ||
           (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/ciflow/'))) }}
    runs-on: [self-hosted, Windows, X64, windows-wheel-signing]
    environment: windows-wheel-signing
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .ci/wheel/windows
      - name: Download this run's unsigned wheel
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: ${{ format('{0}-unsigned', inputs.build_name) }}
          path: ${{ runner.temp }}/unsigned-wheel
      - name: Sign, verify and rebuild the complete RECORD
        shell: powershell
        env:
          WINDOWS_WHEEL_SIGNING_POLICY: ${{ vars.WINDOWS_WHEEL_SIGNING_POLICY }}
          WINDOWS_WHEEL_SIGNING_COMMAND: ${{ vars.WINDOWS_WHEEL_SIGNING_COMMAND }}
          WHEEL_BACKEND: ${{ inputs.backend }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .ci/wheel/windows/sign_wheel.py sign "$env:RUNNER_TEMP/unsigned-wheel" "$env:RUNNER_TEMP/final-wheel" --backend "$env:WHEEL_BACKEND"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload only the verified final artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: ${{ format('{0}-signed', inputs.build_name) }}
          path: ${{ runner.temp }}/final-wheel
          if-no-files-found: error
          retention-days: 14
